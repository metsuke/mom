[tool.poetry]
name = "mom-py"
version = "0.2.2"
description = "MetsuOS Methodology (MOM) - Motor en Python sin dependencias externas"
authors = ["Metsuke <metsuke@metsuos.org>"]
readme = "USER_MANUAL.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
mypy = "^1.8.0"
ruff = "^0.2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true

