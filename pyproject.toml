[tool.poetry]
name = "mom-core"
version = "0.2.0"
description = "MetsuOS Methodology (MOM) - Sistema multiproyecto de especificación atómica con herencia DAG y cero dependencias"
authors = ["Metsuke <metsuke@metsuos.org>"]
readme = "README.md"
packages = [{include = "mom"}]

[tool.poetry.dependencies]
python = "^3.11"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
mypy = "^1.8.0"
ruff = "^0.2.0"

[tool.poetry.scripts]
mom = "mom.cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true